name: Daily verse push
on:
  schedule:
    - cron: '30 8 * * *'   # 4:30 AM Orlando (EDT) / 3:30 AM (EST), before the earliest 5 AM slot
  workflow_dispatch:
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/send_verse.py
        env:
          ONESIGNAL_KEY: ${{ secrets.ONESIGNAL_KEY }}
